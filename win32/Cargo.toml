# VEILOS's own Windows system DLLs (WIN32_DESIGN.md): no_std Rust built as
# real PE DLLs for x86_64-pc-windows-msvc. `sh build.sh` builds them and
# installs them into storage/system.
[workspace]
resolver = "2"
members = ["nt_abi", "ntdll", "kernel32", "ucrtbase", "gdi32", "user32", "comctl32", "shell32", "comdlg32", "riched20", "ws2_32", "msvcp140"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
